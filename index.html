<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CyberZone · إدارة الصالة</title>
  <meta name="description" content="CyberZone — نظام متكامل لإدارة صالات الألعاب: مؤقتات الأجهزة، الحجوزات، البوفيه، الإيصالات والتقارير.">
  <meta name="theme-color" content="#070a14">
  <!-- pwa:start -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CyberZone">
  <!-- pwa:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<!-- app:start -->
<div class="app">
  <aside class="rail" aria-label="التنقل الرئيسي">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <div style="min-width:0">
        <div class="brand-name" id="brand-name">CyberZone</div>
        <div class="brand-sub">إدارة صالة الألعاب</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div>
        <div class="rail-clock hud" id="clock">--:--</div>
        <div class="rail-date" id="clock-date"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-icon" id="theme-btn" data-action="toggle-theme" title="تبديل السمة" aria-label="تبديل السمة"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div id="banners"></div>
    <main id="view" class="view-root" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div id="print-root" aria-hidden="true"></div>
<noscript><p style="padding:24px;text-align:center">يحتاج CyberZone إلى تفعيل JavaScript في المتصفح.</p></noscript>
<!-- app:end -->

<script src="assets/js/billing.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/actions.js"></script>
<script src="assets/js/app.js"></script>
<!-- pwa:start -->
<script>
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* التطبيق يعمل دون وضع عدم الاتصال */ });
    });
  }
</script>
<!-- pwa:end -->
</body>
</html>
