<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CyberZone · إدارة الصالة</title>
  <meta name="description" content="CyberZone — نظام متكامل لإدارة صالات الألعاب: مؤقتات الأجهزة، الحجوزات، البوفيه، الإيصالات والتقارير.">
  <meta name="theme-color" content="#141518">
  <!-- pwa:start -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CyberZone">
  <!-- pwa:end -->
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<!-- app:start -->
<header class="top">
  <a class="wordmark" id="wordmark" href="#floor" aria-label="CyberZone">CYBER<b>ZONE</b></a>
  <nav class="tabs" id="nav" aria-label="الأقسام"></nav>
  <div class="top-end">
    <a class="shift-chip" id="shift-chip" href="#cash"></a>
    <div style="text-align:center">
      <div class="clock led" id="clock" aria-label="الساعة">--:--</div>
      <div class="clock-date" id="clock-date"></div>
    </div>
    <button type="button" class="btn btn-ghost btn-icon" id="theme-btn" data-action="toggle-theme" aria-label="تبديل السمة"></button>
  </div>
</header>

<div class="main">
  <div id="banners"></div>
  <header class="page-head" id="topbar"></header>
  <main id="view" class="view-root" tabindex="-1"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="الأقسام"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div id="print-root" aria-hidden="true"></div>
<noscript><p style="padding:24px;text-align:center">يحتاج CyberZone إلى تفعيل JavaScript في المتصفح.</p></noscript>
<!-- app:end -->

<script src="assets/js/billing.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/native.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/actions.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/cash.js"></script>
<script src="assets/js/app.js"></script>
<!-- pwa:start -->
<script>
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* التطبيق يعمل دون وضع عدم الاتصال */ });
    });
  }
</script>
<!-- pwa:end -->
</body>
</html>
