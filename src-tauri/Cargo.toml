[package]
name = "cyberzone"
version = "2.2.0"
description = "CyberZone — إدارة صالة الألعاب"
authors = ["CyberZone"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cyberzone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
